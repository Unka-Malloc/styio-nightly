name: styio-ci

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - agent-dev

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      STYIO_LLVM_MAJOR: "18"
      STYIO_CMAKE_VERSION: "3.31.6"
      STYIO_PYTHON_VERSION: "3.13.5"

    steps:
      - name: Checkout styio-nightly
        uses: actions/checkout@v5
        with:
          path: styio-nightly

      - name: Checkout styio-spio sibling repository
        uses: actions/checkout@v5
        with:
          repository: Unka-Malloc/styio-spio
          path: styio-spio

      - name: Checkout styio-view sibling repository
        uses: actions/checkout@v5
        with:
          repository: Unka-Malloc/styio-view
          path: styio-view

      - name: Set up standardized Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.STYIO_PYTHON_VERSION }}

      - name: Install standardized CMake / CTest
        run: |
          python -m pip install --upgrade pip
          python -m pip install --user "cmake==${STYIO_CMAKE_VERSION}" "lit==18.1.8"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            clang-${STYIO_LLVM_MAJOR} \
            lld-${STYIO_LLVM_MAJOR} \
            llvm-${STYIO_LLVM_MAJOR}-dev \
            libicu-dev \
            llvm-${STYIO_LLVM_MAJOR}-tools

      - name: Verify standardized toolchain
        run: |
          python3 --version
          cmake --version | head -n1
          ctest --version | head -n1
          clang-${STYIO_LLVM_MAJOR} --version | head -n1
          llvm-config-${STYIO_LLVM_MAJOR} --version

      - name: Configure
        working-directory: styio-nightly
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-${STYIO_LLVM_MAJOR}
          -DCMAKE_CXX_COMPILER=clang++-${STYIO_LLVM_MAJOR}
          -DLLVM_DIR=/usr/lib/llvm-${STYIO_LLVM_MAJOR}/lib/cmake/llvm
          -DSTYIO_ENABLE_FUZZ=ON

      - name: Build
        working-directory: styio-nightly
        run: >
          cmake --build build --target
          styio styio_test styio_security_test styio_soak_test
          styio_fuzz_lexer styio_fuzz_parser

      - name: Docs gate
        working-directory: styio-nightly
        run: ./scripts/docs-gate.sh

      - name: Checkpoint health
        working-directory: styio-nightly
        run: ./scripts/checkpoint-health.sh --build-dir build
