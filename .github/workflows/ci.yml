name: styio-ci

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - agent-dev

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout styio-nightly
        uses: actions/checkout@v5
        with:
          path: styio-nightly

      - name: Checkout styio-spio sibling repository
        uses: actions/checkout@v5
        with:
          repository: Unka-Malloc/styio-spio
          path: styio-spio

      - name: Checkout styio-view sibling repository
        uses: actions/checkout@v5
        with:
          repository: Unka-Malloc/styio-view
          path: styio-view

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang-18 \
            lld-18 \
            llvm-18-dev \
            libicu-dev \
            python3

      - name: Configure
        working-directory: styio-nightly
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang-18
          -DCMAKE_CXX_COMPILER=clang++-18
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DSTYIO_ENABLE_FUZZ=ON

      - name: Build
        working-directory: styio-nightly
        run: >
          cmake --build build --target
          styio styio_test styio_security_test styio_soak_test
          styio_fuzz_lexer styio_fuzz_parser

      - name: Docs gate
        working-directory: styio-nightly
        run: ./scripts/docs-gate.sh

      - name: Checkpoint health
        working-directory: styio-nightly
        run: ./scripts/checkpoint-health.sh --build-dir build
