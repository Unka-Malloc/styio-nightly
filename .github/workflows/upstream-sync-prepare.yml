name: upstream-sync-prepare

on:
  push:
    branches: [agent/upstream-sync-audit-2026-09-28]
    paths: [.github/workflows/upstream-sync-prepare.yml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 47d30395031c4b71798266ccc38f81e38e59fb35
          fetch-depth: 0
      - name: Apply audited patch to the immutable source tree
        env:
          PATCH_GZIP_BASE64: 